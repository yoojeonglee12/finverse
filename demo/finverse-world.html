  .back:hover{color:var(--ink)}

  .wrap{display:flex;height:calc(100% - 47px);min-height:0}
  .stage{flex:1;position:relative;min-width:0}
  canvas{display:block;width:100%;height:100%}

  .legend{position:absolute;left:14px;top:12px;background:rgba(20,25,34,.92);border:1px solid var(--line);

  .legend .ln{display:inline-block;width:18px;border-top-style:solid;flex:0 0 auto}
  .legend hr{border:0;border-top:1px solid var(--line);margin:8px 0}
  .legend b{color:var(--ink)}

  .tip{position:absolute;pointer-events:none;background:#0d1219;border:1px solid #2f3d4d;border-radius:9px;

  .tip b{color:#fff}
  .tip .sub{color:var(--ink3);font-size:11px;margin-top:3px}

  .empty b{color:var(--ink2)}

  .rel-arrow{color:var(--ink3);margin:0 5px}
  .rel-meta{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}

  .pill.neg{color:#8ab6ff;border-color:#213456;background:#111823}
  .rel-basis{font-size:12.5px;color:var(--ink2);line-height:1.65;margin-top:6px;
    border-left:2px solid var(--line);padding-left:9px}
  .rel-conf{font-size:11.5px;color:var(--ink3);margin-top:9px}
  .rel-conf b{color:var(--ink2)}

  .bar .nm{color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .tr{position:relative;height:15px;background:#0d1219;border-radius:4px;overflow:hidden}
  .bar .tr i{position:absolute;top:0;bottom:0;left:50%;width:1px;background:#2a3542}
  .bar .fl{position:absolute;top:2px;bottom:2px;border-radius:3px}
  .bar .vl{text-align:right;font-weight:750;font-size:11px;color:var(--ink3)}
  .bar.mine .nm{color:#fff;font-weight:750}

  .note b{color:var(--ink2)}
  .warn{font-size:11px;color:#d3ae3f;background:#1a1710;border:1px solid #3a3218;border-radius:7px;padding:7px 9px;margin-top:9px;line-height:1.55}
  .warn b{color:#e8c85a}

  .pf{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;
    border-top:1px solid var(--line);padding-top:10px}
  .pf .lab{font-size:12px;color:var(--ink2);font-weight:650}

</head>

</div>

/* 내 보유 (가상 프로필 · 실계좌 연동 없음) */
const MYHOLD = {'삼성전자':.30,'SK하이닉스':.20,'LG에너지솔루션':.20,'카카오':.15,'KB금융':.15};

/* ==========================================================================
   노드 · 엣지 구성
   ========================================================================== */
const SW = {'강':3,'중':2,'약':1};
const nodes=[], byId=new Map();
function add(id,label,type,extra){ const n=Object.assign({id,label,type,x:0,y:0,r:6},extra||{}); byId.set(id,n); nodes.push(n); return n; }
EVT.forEach(([i,l])=>add(i,l,'evt',{r:5}));
INST.forEach(([i,l])=>add(i,l,'inst',{r:7}));
IND.forEach(([i,l])=>add(i,l,'ind',{r:9}));
SEC.forEach(([i,l])=>add(i,l,'sec',{r:11}));
const secOf=new Map();
Object.entries(STOCKS).forEach(([s,list])=>list.forEach(nm=>{
  add(nm,nm,'stk',{r:MYHOLD[nm]?4.5:2.8,sector:s,held:!!MYHOLD[nm]}); secOf.set(nm,s);
}));

const edges = REL.map(([id,f,t,kind,sign,st,lag,basis,conf])=>({
  id,from:f,to:t,kind,sign,st,lag,basis,conf,a:byId.get(f),b:byId.get(t)
}));
const memberEdges=[];
Object.entries(STOCKS).forEach(([s,list])=>list.forEach(nm=>
  memberEdges.push({a:byId.get(nm),b:byId.get(s)})));

/* ==========================================================================
   계층 레이아웃 (물리 시뮬 없음 — 결정적 배치)
   ========================================================================== */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'), tip=document.getElementById('tip');
let VW,VH,dpr, showStocks=true, mineOnly=false, showUp=true;
const COLX={};

function layout(){
  const padT=52, padB=26, H=Math.max(120, VH-padT-padB);
  COLX.evt=VW*0.055; COLX.inst=VW*0.175; COLX.ind=VW*0.375; COLX.sec=VW*0.625; COLX.stk=VW*0.815;
  const COLS=3, ROWH=15, GAP=14;
  const rows = SEC.map(([s])=>Math.ceil(STOCKS[s].length/COLS));
  const totalH = rows.reduce((a,b)=>a+b,0)*ROWH + GAP*(SEC.length-1);
  const sc = Math.min(1, H/totalH);
  let y = padT + Math.max(0,(H-totalH*sc)/2);
  SEC.forEach(([s],i)=>{
    const h = rows[i]*ROWH*sc, sec=byId.get(s);
    sec.x=COLX.sec; sec.y=y+h/2;
    STOCKS[s].forEach((nm,k)=>{
      const n=byId.get(nm);
      n.x = COLX.stk + (k%COLS)*20;
      n.y = y + (Math.floor(k/COLS)+0.5)*(h/rows[i]);
    });
    y += h + GAP*sc;
  });
  const spread=(arr,x)=>arr.forEach(([id],i)=>{const n=byId.get(id); n.x=x; n.y=padT+(i+0.5)*(H/arr.length);});
  spread(IND,COLX.ind); spread(INST,COLX.inst); spread(EVT,COLX.evt);
}
function resize(){
  const r=cv.parentElement.getBoundingClientRect(); dpr=window.devicePixelRatio||1;
  VW=r.width; VH=r.height; cv.width=VW*dpr; cv.height=VH*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); layout();
}
new ResizeObserver(resize).observe(cv.parentElement); resize();

/* ==========================================================================
   렌더
   ========================================================================== */
const COL={evt:'#5aa9a0',inst:'#3987e5',ind:'#d95926',sec:'#9085e9',stk:'#7f93a8'};
let hoverEdge=null, hoverNode=null, selInd=null;

function nodeVisible(n){
  if(n.type==='stk'){ if(!showStocks) return false; if(mineOnly&&!n.held) return false; }
  if((n.type==='evt'||n.type==='inst')&&!showUp) return false;
  return true;
}
function mineSectors(){ const s=new Set(); Object.keys(MYHOLD).forEach(nm=>s.add(secOf.get(nm))); return s; }
function edgeVisible(e,ms){
  if(!nodeVisible(e.a)||!nodeVisible(e.b)) return false;
  if(mineOnly && e.b.type==='sec' && !ms.has(e.to)) return false;
  return true;
}
function curve(a,b){
  const mx=(a.x+b.x)/2;
  ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.bezierCurveTo(mx,a.y,mx,b.y,b.x,b.y); ctx.stroke();
}
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}

function draw(){
  ctx.clearRect(0,0,VW,VH);
  const ms = mineOnly?mineSectors():null;

  ctx.font='650 10.5px system-ui,sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#3d4b5c';
  if(showUp){ ctx.fillText('이벤트',COLX.evt,28); ctx.fillText('기관·정부',COLX.inst,28); }
  ctx.fillText('지표',COLX.ind,28); ctx.fillText('섹터',COLX.sec,28);
  if(showStocks) ctx.fillText('종목',COLX.stk+20,28);

  if(showStocks){
    ctx.strokeStyle='rgba(95,115,140,.15)'; ctx.lineWidth=.6;
    for(const m of memberEdges){ if(mineOnly&&!m.a.held) continue;
      ctx.beginPath(); ctx.moveTo(m.a.x,m.a.y); ctx.lineTo(m.b.x,m.b.y); ctx.stroke(); }
  }

  for(const e of edges){
    if(!edgeVisible(e,ms)) continue;
    const hot = hoverEdge===e;
    const dim = (hoverEdge&&!hot)
             || (hoverNode && e.from!==hoverNode.id && e.to!==hoverNode.id)
             || (selInd && e.from!==selInd && e.to!==selInd);
    const c = e.sign>0?[224,80,63]:[59,130,246];
    const a = hot?1 : dim?0.06 : (e.kind==='regulates'?0.32:0.44);
    ctx.strokeStyle=`rgba(${c[0]},${c[1]},${c[2]},${a})`;
    ctx.lineWidth=SW[e.st]*(hot?1.6:1);
    ctx.setLineDash(e.kind==='regulates'?[5,4]:[]);
    curve(e.a,e.b);
    ctx.setLineDash([]);
  }

  const order={stk:0,evt:1,inst:2,ind:3,sec:4};
  [...nodes].sort((p,q)=>order[p.type]-order[q.type]).forEach(n=>{
    if(!nodeVisible(n)) return;
    const linked = hoverNode && edges.some(e=>(e.from===hoverNode.id&&e.to===n.id)||(e.to===hoverNode.id&&e.from===n.id));
    const selLinked = selInd && (n.id===selInd || edges.some(e=>e.from===selInd&&e.to===n.id));
    let dim = (hoverNode&&hoverNode!==n&&!linked) || (selInd&&!selLinked&&n.type!=='stk');
    if(mineOnly&&n.type==='sec'&&!ms.has(n.id)) dim=true;
    ctx.globalAlpha = dim?0.2:1;
    const c=COL[n.type];
    if(selInd===n.id||n.held){ ctx.beginPath(); ctx.arc(n.x,n.y,n.r+5,0,7); ctx.fillStyle=hexA(c,.22); ctx.fill(); }
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,7); ctx.fillStyle=c; ctx.fill();
    if(n.type!=='stk'){
      ctx.strokeStyle='rgba(255,255,255,.2)'; ctx.lineWidth=1; ctx.stroke();
      ctx.fillStyle = dim?'#455568':'#dbe6f2';
      ctx.font = n.type==='sec'?'700 12px system-ui,sans-serif':'600 11px system-ui,sans-serif';
      ctx.textAlign = n.type==='sec'?'right':'left';
      ctx.fillText(n.label, n.x+(n.type==='sec'?-n.r-7:n.r+7), n.y+4);
    } else if(n.held){
      ctx.fillStyle='#c6d3e2'; ctx.font='600 9.5px system-ui,sans-serif'; ctx.textAlign='left';
      ctx.fillText(n.label, n.x+6, n.y+3);
    }
    ctx.globalAlpha=1;
  });
  requestAnimationFrame(draw);
}
draw();

/* ==========================================================================
   상호작용
   ========================================================================== */
function ptOnCurve(a,b,t){
  const mx=(a.x+b.x)/2, u=1-t;
  return [ u*u*u*a.x + 3*u*u*t*mx + 3*u*t*t*mx + t*t*t*b.x,
           u*u*u*a.y + 3*u*u*t*a.y + 3*u*t*t*b.y + t*t*t*b.y ];
}
function distToEdge(e,mx,my){
  let best=1e9;
  for(let t=0;t<=1.0001;t+=0.05){ const [x,y]=ptOnCurve(e.a,e.b,t); const d=Math.hypot(x-mx,y-my); if(d<best) best=d; }
  return best;
}
cv.addEventListener('mousemove',ev=>{
  const r=cv.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top;
  const ms = mineOnly?mineSectors():null;
  hoverNode=null;
  for(const n of nodes){ if(!nodeVisible(n)) continue;
    if(Math.hypot(n.x-mx,n.y-my)<n.r+5){ hoverNode=n; break; } }
  hoverEdge=null;
  if(!hoverNode){
    let best=9, cand=null;
    for(const e of edges){ if(!edgeVisible(e,ms)) continue;
      const d=distToEdge(e,mx,my); if(d<best){best=d;cand=e;} }
    hoverEdge=cand;
  }
  if(hoverEdge){
    showRel(hoverEdge);
    tipAt(ev,`<b>${hoverEdge.a.label} → ${hoverEdge.b.label}</b>
      <div class="sub">${hoverEdge.id} · ${hoverEdge.kind} · ${hoverEdge.sign>0?'촉진 +':'억제 −'} · 강도 ${hoverEdge.st}</div>`);
  } else if(hoverNode){
    const deg=edges.filter(e=>e.from===hoverNode.id||e.to===hoverNode.id).length;
    const tn={evt:'경제이벤트',inst:'기관·정부',ind:'지표',sec:'섹터',stk:'종목'}[hoverNode.type];
    const sub = hoverNode.type==='stk'
      ? `${byId.get(hoverNode.sector).label} 소속 · 매크로와 직접 연결 없음`
      : `${tn} · 관계 ${deg}개${hoverNode.type==='ind'?' · 클릭하면 충격 전파':''}`;
    tipAt(ev,`<b>${hoverNode.label}</b><div class="sub">${sub}</div>`);
  } else hideTip();
  cv.style.cursor = (hoverNode&&hoverNode.type==='ind')?'pointer':'default';
});
cv.addEventListener('mouseleave',()=>{hoverEdge=null;hoverNode=null;hideTip();});
cv.addEventListener('click',()=>{
  if(hoverNode&&hoverNode.type==='ind') selInd = (selInd===hoverNode.id)?null:hoverNode.id;
  else if(!hoverNode&&!hoverEdge) selInd=null;
  renderShock();
});
function tipAt(ev,html){
  const r=cv.getBoundingClientRect();
  tip.innerHTML=html; tip.style.opacity=1;
  tip.style.left=Math.min(ev.clientX-r.left+14, Math.max(8,VW-312))+'px';
  tip.style.top=(ev.clientY-r.top+14)+'px';
}
function hideTip(){ tip.style.opacity=0; }

/* 관계 패널 */
const relBox=document.getElementById('relBox');
function showRel(e){
  const cnote = e.conf==='하'?' — 상충 요인 존재, 실증 필수' : e.conf==='중'?' — 시장 통념, 실증 권장' : ' — 교과서적 인과';
  relBox.innerHTML=`
    <span class="rel-id">${e.id}</span> <span class="rel-id">${e.kind}${e.kind==='regulates'?' 【제안】':''}</span>
    <div class="rel-path">${e.a.label}<span class="rel-arrow">→</span>${e.b.label}</div>
    <div class="rel-meta">
      <span class="pill ${e.sign>0?'pos':'neg'}">${e.sign>0?'+ 촉진':'− 억제'}</span>
      <span class="pill">강도 ${e.st}</span>
      <span class="pill">시차 ${e.lag}</span>
    </div>
    <div class="rel-basis">${e.basis}</div>
    <div class="rel-conf">확신도 <b>${e.conf}</b>${cnote}</div>`;
}

/* 충격 전파 — 2-hop 계산 */
const shockBox=document.getElementById('shockBox'), shockSrc=document.getElementById('shockSrc');
function renderShock(){
  if(!selInd){
    shockSrc.textContent='';
    shockBox.innerHTML=`<div class="empty">지표 노드를 <b>클릭</b>하면, 그 지표가 각 섹터에 미치는 <b>상대 영향도</b>와 내 보유 비중을 곱한 <b>포트폴리오 영향</b>을 계산합니다.</div>`;
    return;
  }
  const src=byId.get(selInd);
  shockSrc.textContent=`— ${src.label} 상승 시`;
  const map=new Map(edges.filter(e=>e.kind==='drives'&&e.from===selInd).map(e=>[e.to,e.sign*SW[e.st]]));
  const secW={}; Object.entries(MYHOLD).forEach(([nm,w])=>{const s=secOf.get(nm); secW[s]=(secW[s]||0)+w;});
  let rows='', port=0;
  SEC.forEach(([s,label])=>{
    const v=map.get(s)||0, w=secW[s]||0;
    port += v*w;
    const pct=Math.abs(v)/3*50, col=v>0?'var(--pos)':'var(--neg)';
    rows+=`<div class="bar ${w?'mine':''}">
      <div class="nm">${label}${w?` · 내 ${Math.round(w*100)}%`:''}</div>
      <div class="tr"><i></i>${v?`<div class="fl" style="background:${col};${v>0?`left:50%;width:${pct}%`:`right:50%;width:${pct}%`}"></div>`:''}</div>
      <div class="vl">${v>0?'+':''}${v||'—'}</div></div>`;
  });
  const pcol = port>0?'var(--pos)':port<0?'var(--neg)':'var(--ink3)';
  shockBox.innerHTML = rows +
    `<div class="pf"><span class="lab">내 포트폴리오 영향</span>
       <span class="val" style="color:${pcol}">${port>0?'+':''}${port.toFixed(2)}</span></div>
     <div class="note"><b>계산</b> = Σ (섹터 영향도 × 내 보유 비중) — <b>2-hop</b>.
       지표 충격이 섹터를 거쳐 종목 비중에 닿습니다. <b>종목별 엣지 없이</b> 성립합니다.</div>
     <div class="warn">⚠ <b>−3 ~ +3 상대 영향도</b>이며 수익률·가격이 아닙니다. 강도(강/중/약)는 아직 실증되지 않은 초안값입니다.</div>`;
}
renderShock();

/* 토글 */
const bS=document.getElementById('tStocks'), bM=document.getElementById('tMine'), bU=document.getElementById('tUp');
bS.onclick=()=>{ showStocks=!showStocks; bS.classList.toggle('on',showStocks);
  if(!showStocks){ mineOnly=false; bM.classList.remove('on'); } };
bM.onclick=()=>{ mineOnly=!mineOnly; bM.classList.toggle('on',mineOnly);
  if(mineOnly){ showStocks=true; bS.classList.add('on'); } };
bU.onclick=()=>{ showUp=!showUp; bU.classList.toggle('on',showUp); };
</script>
</body>
